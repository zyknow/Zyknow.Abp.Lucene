name: Publish

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version_suffix:
        description: '覆盖预发布后缀（例如 preview.2）；留空使用 common.props 中的版本'
        required: false
        type: string
      release_name:
        description: 'GitHub Release 名称（留空将使用 v<version>）'
        required: false
        type: string
      release_notes:
        description: 'GitHub Release 内容（可多行；留空则使用默认内容）'
        required: false
        type: string
      skip_tests:
        description: '跳过测试（默认否）'
        required: false
        default: false
        type: boolean
      draft:
        description: '将 Release 设为草稿（默认否）'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  decide:
    name: Decide publish
    runs-on: windows-2025
    outputs:
      proceed: ${{ steps.decision.outputs.proceed }}
      reason: ${{ steps.decision.outputs.reason }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide by manual trigger or commit message
        id: decision
        shell: pwsh
        run: |
          $eventName = '${{ github.event_name }}'
          if ($eventName -eq 'workflow_dispatch') {
            "proceed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "reason=manual dispatch" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }

          git config --global --add safe.directory $PWD
          $before = '${{ github.event.before }}'
          $after = '${{ github.sha }}'

          $log = git log --format=%B $before..$after 2>$null
          $hasPublishNuget = $false
          if ($log) {
            # 区分大小写、逐行匹配，并要求在行首匹配
            if ($log -cmatch '(?m)^Publish Nuget') { $hasPublishNuget = $true }
          }

          $proceed = $hasPublishNuget
          "proceed=$($proceed.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $reason = if ($hasPublishNuget) { "Found 'Publish Nuget' at start of a line in commits" } else { "Commit messages missing line-start 'Publish Nuget' (case-sensitive)" }
          "reason=$reason" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Echo decision
        shell: pwsh 
        run: |
          Write-Host "Proceed=${{ steps.decision.outputs.proceed }} Reason=${{ steps.decision.outputs.reason }}"

  publish:
    needs: decide
    if: ${{ needs.decide.outputs.proceed == 'true' }}
    runs-on: windows-2025
    permissions:
      contents: write
      id-token: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Compute version for release
        id: compute_version
        shell: pwsh
        env:
          VERSION_SUFFIX: ${{ inputs.version_suffix }}
        run: |
          [xml]$xml = Get-Content -Raw -Path 'common.props'
          $version = $xml.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw '未能从 common.props 读取 <Version>' }
          if (-not [string]::IsNullOrWhiteSpace($env:VERSION_SUFFIX)) {
            if ($env:VERSION_SUFFIX -notmatch '\A(?:0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*\z') {
              throw '版本后缀必须是有效的 SemVer 预发布标识，例如 preview.1'
            }
            $baseVersion = ($version -split '[-+]', 2)[0]
            $version = "$baseVersion-$env:VERSION_SUFFIX"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore Zyknow.Abp.Lucene.sln

      - name: Build (Release)
        env:
          RELEASE_VERSION: ${{ steps.compute_version.outputs.version }}
        run: dotnet build Zyknow.Abp.Lucene.sln -c Release --no-restore -p:ContinuousIntegrationBuild=true "-p:Version=$env:RELEASE_VERSION"

      - name: Test (Release)
        if: ${{ inputs.skip_tests != true }}
        run: dotnet test Zyknow.Abp.Lucene.sln -c Release --no-build

      - name: Pack src projects only (Release)
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.compute_version.outputs.version }}
        run: |
          $projects = Get-ChildItem -Path .\src -Recurse -Filter *.csproj
          if (-not $projects) { throw '未在 src 目录下找到任何 .csproj 项目文件' }
          foreach ($project in $projects) {
            dotnet pack $project.FullName -c Release --no-build -o .\artifacts\packages "-p:Version=$env:RELEASE_VERSION"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Sign in to NuGet.org with OIDC
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: zyknow

      - name: Push to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push '.\artifacts\packages\*.nupkg' --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Prepare release body
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.compute_version.outputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          $notes = if ([string]::IsNullOrWhiteSpace($env:RELEASE_NOTES)) { '(未指定发布说明)' } else { $env:RELEASE_NOTES }
          $packages = Get-ChildItem .\artifacts\packages -Filter *.nupkg | ForEach-Object { "- $($_.Name)" }
          @("发布版本: v$env:RELEASE_VERSION", '', '变更说明:', $notes, '', '包文件:') + $packages |
            Set-Content -Path release-body.txt -Encoding utf8

      - name: Upload packages artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

      - name: Create GitHub Release and upload artifacts
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.compute_version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.release_name != '' && inputs.release_name || format('v{0}', steps.compute_version.outputs.version) }}
          body_path: release-body.txt
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ steps.compute_version.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            artifacts/packages/*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
